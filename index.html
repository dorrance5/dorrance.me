<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dorrance.me</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#C6CCCF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
<script>
try{const t=localStorage.getItem('theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
/* The home page is DM-1, a made-up 90s pocket organizer: an LCD with Billie as a pixel pet, one key per app.
   It has one fixed size (358 px wide); the open phone shows it on the left. Aurora is a secret theme (five taps on Billie). */
:root{
  --desk:#C6CCCF;--desk-dot:rgba(0,0,0,.06);
  --body-a:#D9D8D2;--body-b:#BDBCB5;--body-edge:rgba(0,0,0,.22);--body-ink:#55565A;--engrave:rgba(0,0,0,.38);--engrave-hi:rgba(255,255,255,.55);
  --bezel:#34363B;
  --lcd:#ABB99A;--lcd-hi:#BCC9AA;--ink:#1F2A1A;--ink-soft:rgba(31,42,26,.18);--lcd-glow:transparent;
  --key-a:#4B4D53;--key-b:#393B40;--key-ink:#ECEDEE;--key-side:#24252A;
  --mode-a:#F08A3C;--mode-b:#D8682A;--mode-side:#9C4515;
  --cat-a:#8E969F;--cat-b:#737C86;--cat-side:#4B525A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101113;--desk-dot:rgba(255,255,255,.035);
  --body-a:#2C2D31;--body-b:#202125;--body-edge:rgba(0,0,0,.6);--body-ink:#8A8C92;--engrave:rgba(0,0,0,.6);--engrave-hi:rgba(255,255,255,.06);
  --bezel:#121316;--lcd:#46CFA6;--lcd-hi:#6BE3BE;--ink:#0B2A20;--ink-soft:rgba(11,42,32,.16);--lcd-glow:rgba(70,207,166,.35);
  --key-a:#3A3C42;--key-b:#2C2E33;--key-side:#151619;color-scheme:dark}}
:root[data-theme="dark"],:root[data-theme="aurora"]{
  --desk:#101113;--desk-dot:rgba(255,255,255,.035);
  --body-a:#2C2D31;--body-b:#202125;--body-edge:rgba(0,0,0,.6);--body-ink:#8A8C92;--engrave:rgba(0,0,0,.6);--engrave-hi:rgba(255,255,255,.06);
  --bezel:#121316;--lcd:#46CFA6;--lcd-hi:#6BE3BE;--ink:#0B2A20;--ink-soft:rgba(11,42,32,.16);--lcd-glow:rgba(70,207,166,.35);
  --key-a:#3A3C42;--key-b:#2C2E33;--key-side:#151619;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
@media (display-mode:standalone){html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top)))}}
body{background:var(--desk);background-image:radial-gradient(var(--desk-dot) 1px,transparent 1.5px);background-size:14px 14px;
  font:15px/1.3 var(--ui);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* the gadget */
.dev{width:358px;flex:none;display:flex;flex-direction:column;filter:drop-shadow(0 14px 22px rgba(0,0,0,.28))}
.half{background:linear-gradient(170deg,var(--body-a),var(--body-b));padding:12px 14px;display:flex;flex-direction:column;gap:10px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 var(--body-edge)}
.top{border-radius:26px 26px 0 0;padding-bottom:6px}
.bottom{border-radius:0 0 30px 30px;padding-top:6px;flex:1}

.brand{display:flex;align-items:center;gap:8px;padding:0 4px;color:var(--body-ink)}
.brand svg{width:20px;height:20px}
.brand b{font:800 14px/1 var(--ui);letter-spacing:.02em;color:var(--engrave);text-shadow:0 1px 0 var(--engrave-hi)}
.brand i{font:700 10px/1 var(--mono);letter-spacing:.18em;font-style:normal;color:var(--engrave);text-shadow:0 1px 0 var(--engrave-hi)}
.grille{margin:-16px -14px -16px auto;padding:16px 14px;display:grid;grid-template-columns:repeat(6,4px);gap:3px;touch-action:none}
.grille span{width:4px;height:4px;border-radius:50%;background:var(--engrave);box-shadow:0 1px 0 var(--engrave-hi)}
.snd{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0 4px;height:44px;align-self:flex-start;cursor:pointer;font:700 9px/1 var(--mono);letter-spacing:.14em;color:var(--engrave)}
.snd span{width:26px;height:12px;border-radius:3px;background:var(--engrave);position:relative}
.snd span::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:8px;border-radius:2px;background:var(--body-a);transition:left .15s}
.snd[aria-pressed="true"] span::after{left:14px;background:var(--mode-a)}

/* screen */
.bezel{background:var(--bezel);border-radius:14px;padding:10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 var(--engrave-hi)}
.lcd{--px:4px;position:relative;background:var(--lcd);color:var(--ink);border-radius:5px;padding:10px 12px;height:128px;overflow:hidden;cursor:pointer;
  display:grid;grid-template-rows:auto 1fr auto;gap:6px;font:700 13px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 26px var(--lcd-glow);
  background-image:linear-gradient(var(--ink-soft) 1px,transparent 1px),linear-gradient(90deg,var(--ink-soft) 1px,transparent 1px),radial-gradient(120% 90% at 30% 10%,var(--lcd-hi),var(--lcd));
  background-size:3px 3px,3px 3px,100% 100%;background-blend-mode:normal}
:root[data-theme="aurora"] .lcd{animation:aur 6s linear infinite;--lcd-glow:rgba(160,120,255,.5)}
@keyframes aur{to{filter:hue-rotate(360deg)}}
.lcd .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.batt{display:flex;align-items:center;gap:5px}
.batt i{display:flex;gap:2px;padding:2px;border:2px solid var(--ink);border-radius:2px}
.batt i b{width:4px;height:7px;background:var(--ink)}
.batt.low i b:nth-child(n+2){visibility:hidden}
.stage{display:flex;align-items:center;gap:12px;min-height:0}
.pet{flex:none;display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.pet rect{fill:var(--ink)}
.bubble{min-width:0;font-size:12px;line-height:1.35;opacity:.9}
.zz{font-size:12px;animation:zz 2s steps(3) infinite}
@keyframes zz{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.msg{white-space:nowrap;overflow:hidden;min-height:1.2em}
.msg::after{content:"_";animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.lcd.photo .stage{display:none}
.shot{display:none;height:100%;width:auto;min-height:0;justify-self:center;image-rendering:pixelated}
/* the photo takes the clock row's place, so the screen keeps its height */
.lcd.photo{grid-template-rows:1fr auto}
.lcd.photo .row{display:none}
.lcd.photo .shot{display:block}

/* keys */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{--a:var(--key-a);--b:var(--key-b);--side:var(--key-side);position:relative;height:76px;border:0;border-radius:16px 16px 18px 18px;cursor:pointer;color:var(--key-ink);
  background:linear-gradient(180deg,var(--a),var(--b));box-shadow:0 5px 0 var(--side),0 7px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 4px 8px;transition:transform .06s,box-shadow .06s;text-decoration:none;font:inherit}
.key:active,.key.down{transform:translateY(4px);box-shadow:0 1px 0 var(--side),0 2px 4px rgba(0,0,0,.25),inset 0 2px 4px rgba(0,0,0,.25)}
.key .g{width:46px;height:46px;margin:-5px 0;pointer-events:none}
.key{text-shadow:0 1px 0 rgba(0,0,0,.18)}
.key svg{width:28px;height:28px;margin:4px}
.key span{font:800 11px/1 var(--mono);letter-spacing:.12em}
.key.mode{--a:var(--mode-a);--b:var(--mode-b);--side:var(--mode-side)}
.key.cat{--a:var(--cat-a);--b:var(--cat-b);--side:var(--cat-side)}
.key:focus-visible{outline:3px solid var(--mode-a);outline-offset:3px}

.sticker{align-self:center;margin-top:auto;font:700 9px/1.6 var(--mono);letter-spacing:.16em;color:var(--engrave);text-shadow:0 1px 0 var(--engrave-hi);text-align:center;padding:4px 0 2px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:#1D1E21;color:#E9EAEC;font:600 13px/1 var(--ui);padding:11px 16px;border-radius:10px;transition:.2s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.tap{pointer-events:auto;cursor:pointer}
dialog{border:0;padding:0;background:#000;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;margin:0}
dialog img{width:100%;height:100%;object-fit:contain}
dialog button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px}

/* OPEN (upright or sideways): the same one gadget, on the left */
@media (min-width:560px){
  body{justify-content:flex-start;padding-left:max(28px,env(safe-area-inset-left))}
  /* the speaker grille is a handle: drag it to move the gadget around the screen */
  .grille{cursor:grab}
  .dev.lifted{filter:drop-shadow(0 26px 34px rgba(0,0,0,.36))}
  .dev.lifted .grille{cursor:grabbing}
}
/* shaken too hard: the screen glitches and the case rattles */
.lcd.glitch{animation:glitch .9s steps(9)}
@keyframes glitch{0%,100%{transform:none;filter:none}20%{transform:translateX(-3px);filter:contrast(1.8)}40%{transform:translate(2px,1px);filter:invert(.15)}60%{transform:translateX(-1px);filter:contrast(.6)}80%{transform:translateX(2px);filter:none}}
.dev.rattle .half{animation:rattle .5s linear}
@keyframes rattle{25%{transform:rotate(-1.2deg)}50%{transform:rotate(1deg)}75%{transform:rotate(-.6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="dev" id="dev">
  <div class="half top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 10h6.5a21 22 0 0 1 0 44H26zM26 21.7h6.5a9.2 10.3 0 0 1 0 20.6H26z" fill="#D7372E" fill-rule="evenodd"/><rect x="13" y="10" width="13" height="44" fill="#1F4FB5"/><path d="M57 7H44L57 20z" fill="#F2B705"/></svg>
      <b>dorrance</b><i>DM-1</i>
      <div class="grille" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="bezel">
      <div class="lcd" id="lcd" role="status" aria-live="polite">
        <div class="row"><span id="clock">--:--</span><span class="batt" id="batt"><span id="battTxt"></span><i><b></b><b></b><b></b></i></span></div>
        <div class="stage" id="stage"><svg class="pet" id="pet"></svg><span class="bubble" id="bubble"></span></div>
        <canvas class="shot" id="shot" width="63" height="42"></canvas>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>
  <div class="half bottom">
    <div class="keys" id="keys"></div>
    <button class="snd" id="snd" aria-pressed="true" aria-label="Key clicks">SND <span></span></button>
    <div class="sticker">MODEL DM-1 · MADE BY HAND IN THE U.S.<br>NOT WATERPROOF · DO NOT FEED AFTER MIDNIGHT</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<dialog id="viewer"><img id="viewerImg" alt="Billie, my cat"><button id="vclose" aria-label="Close">✕</button></dialog>

<script>
const $=s=>document.querySelector(s),root=document.documentElement;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const APPS=[
  {id:'tvmount',c:['#3B86F7','#1F6AE0','#14479C'],name:'TV Mount',key:'TV MNT',think:'…measuring?'},
  {id:'roadtrip',c:['#2FB57A','#1E955F','#13653F'],name:'Road Trip',key:'ROAD',think:'…are we there yet?'},
  {id:'calculator',c:['#F6C945','#E4AE1B','#9E750A'],ink:'#2B2205',name:'Calculator',key:'CALC',think:'…carry the one.'},
  {id:'converter',c:['#9480E8','#7660D6','#4F3D9E'],name:'Converter',key:'CONV',think:'…how many cats in a meter?'},
  {id:'counter',c:['#EE5A4F','#D6403A','#992521'],name:'Counter',key:'COUNT',think:'…1, 2, 3, 4…'},
  {id:'triangle',c:['#27B8B8','#159C9F','#0C6A6D'],name:'Triangle',key:'TRI',think:'…a² + b² = c²'},
  {id:'recipes',c:['#EC6FA8','#D2508E','#93305F'],name:'Recipes',key:'RECIPE',think:'…is it dinner?'}
];
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');t.classList.remove('tap');t.onclick=null;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1700)}

/* keys */
/* each key's glyph: the app icon drawings from docs/icons, in the key's ink colour (no image files, no blend modes) */
const GLYPH={"tvmount":"<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"34\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M150 394h212M206 394v-58M306 394v-58\"/><rect x=\"88\" y=\"126\" width=\"336\" height=\"210\" rx=\"28\"/></g>",
 "roadtrip":"<g transform=\"translate(40 30) scale(18)\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 11l1.6-4.3A2 2 0 0 1 8.5 5.4h7a2 2 0 0 1 1.9 1.3L19 11\"/><path d=\"M3.5 17v-4a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v4z\"/></g><g fill=\"currentColor\"><rect x=\"4.4\" y=\"16.6\" width=\"4.4\" height=\"3.8\" rx=\"1.3\"/><rect x=\"15.2\" y=\"16.6\" width=\"4.4\" height=\"3.8\" rx=\"1.3\"/><circle cx=\"7.6\" cy=\"14\" r=\"1.6\"/><circle cx=\"16.4\" cy=\"14\" r=\"1.6\"/></g></g>",
 "calculator":"<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"30\"><rect x=\"158\" y=\"100\" width=\"196\" height=\"312\" rx=\"34\"/></g><g fill=\"currentColor\"><rect x=\"196\" y=\"140\" width=\"120\" height=\"57\" rx=\"10\"/><circle cx=\"214\" cy=\"247\" r=\"15\"/><circle cx=\"256\" cy=\"247\" r=\"15\"/><circle cx=\"298\" cy=\"247\" r=\"15\"/><circle cx=\"214\" cy=\"301\" r=\"15\"/><circle cx=\"256\" cy=\"301\" r=\"15\"/><circle cx=\"298\" cy=\"301\" r=\"15\"/><circle cx=\"214\" cy=\"356\" r=\"15\"/><rect x=\"241\" y=\"341\" width=\"72\" height=\"30\" rx=\"15\"/></g>",
 "converter":"<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"36\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M120 196h273M332 135l61 61-61 61M391 315H120M181 254l-61 61 61 61\"/></g>",
 "counter":"<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"34\" stroke-linecap=\"round\"><path d=\"M148 150v211M220 150v211M292 150v211M364 150v211M128 320 386 195\"/></g>",
 "triangle":"<g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M120 135v241h270z\" stroke-width=\"36\"/><path d=\"M120 314h66v62\" stroke-width=\"22\"/></g>",
 "recipes":"<g transform=\"translate(51 48) scale(6.4)\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.6\" stroke-linecap=\"round\"><path d=\"M22.5 25.5c-2.6-2.6-2.6-4.9 0-7.5s2.6-4.9 0-7.5M32 25.5c-2.6-2.6-2.6-4.9 0-7.5s2.6-4.9 0-7.5M41.5 25.5c-2.6-2.6-2.6-4.9 0-7.5s2.6-4.9 0-7.5\"/></g><path fill=\"currentColor\" d=\"M11 31.5h42a2 2 0 0 1 2 2.1C54.3 43.7 46.5 51 37 51H27c-9.5 0-17.3-7.3-18-17.4a2 2 0 0 1 2-2.1z\"/><rect x=\"22\" y=\"50\" width=\"20\" height=\"4.5\" rx=\"2.25\" fill=\"currentColor\"/></g>"};
const catSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4l3 4h8l3-4v9a7 7 0 0 1-14 0z"/><circle cx="9.5" cy="12" r="1" fill="currentColor"/><circle cx="14.5" cy="12" r="1" fill="currentColor"/><path d="M11 15.5h2"/></svg>';
const modeSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 12V8a4 4 0 0 1 0 8z" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
$('#keys').innerHTML=APPS.map(a=>`<a class="key" href="${a.id}/" data-app="${a.id}" aria-label="${a.name}" style="--a:${a.c[0]};--b:${a.c[1]};--side:${a.c[2]}${a.ink?';color:'+a.ink:''}"><svg class="g" viewBox="0 0 512 512" aria-hidden="true">${GLYPH[a.id]}</svg><span>${a.key}</span></a>`).join('')
  +`<button class="key cat" data-k="billie" aria-label="Billie">${catSVG}<span>BILLIE</span></button>`
  +`<button class="key mode" data-k="mode" aria-label="Theme">${modeSVG}<span>MODE</span></button>`;

/* Billie, the LCD pet: pixel frames (# = ink) */
const F={
 awake:[".#....#.................",".##..##.................","########..............#.","#.####.#..............#.","########.............#..",".####################...","..###################...","..###################...","..##.##.........##.##..."],
 sleep:["........................",".#....#.................",".##..##.................","########................","#..##..#................","#####################...",".####################...",".#####################..","..####################.."],
 happy:[".#....#...............#.",".##..##...............#.","########..............#.","#.####.#.............#..","###..###.............#..",".####################...","..###################...","..###################...","..##.##.........##.##..."]
};
function draw(name){
  const rows=F[name],w=rows[0].length,h=rows.length,px=parseFloat(getComputedStyle($('#lcd')).getPropertyValue('--px'))||4;
  let r='';rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='#')r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`}));
  const s=$('#pet');s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.setAttribute('width',w*px);s.setAttribute('height',h*px);s.innerHTML=r;
}
let mood='awake',sleepT;
function setMood(m,text){mood=m;draw(m);$('#bubble').innerHTML=text??(m==='sleep'?'<span class="zz">z z z</span>':'');
  clearTimeout(sleepT);if(m!=='sleep')sleepT=setTimeout(()=>setMood('sleep'),9000)}

/* screen text */
let typeT;function type(text){clearInterval(typeT);const el=$('#msg');let i=0;el.textContent='';typeT=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typeT)},Math.max(12,220/text.length))}
function greeting(){const h=new Date().getHours();return '> '+(h<5?'GO TO BED.':h<12?'GOOD MORNING.':h<17?'BACK AT IT.':h<22?'GOOD EVENING.':'GO TO BED.')}
function tick(){$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?([AP])M/i,'$1')}
function batt(){const on=navigator.onLine;$('#batt').classList.toggle('low',!on);$('#battTxt').textContent=on?'ON':'BATT LOW'}
addEventListener('online',batt);addEventListener('offline',()=>{batt();type('> OFFLINE. STILL WORKS.')});

/* theme: Auto (follow the phone) is the default; MODE flips between Day and Night. Once the Aurora secret has been
   found (five taps on Billie, remembered), Night is Aurora. After the secret the next 5 taps on the screen do nothing,
   so the Aurora screen stays up instead of being tapped past. */
let auroraFound=ls.get('dm1-aurora')==='1',petHold=0;
const LABEL={light:'DAY',dark:'NIGHT',aurora:'AURORA'};
const meta=document.querySelectorAll('meta[name="theme-color"]');
function setTheme(t,save=true){
  if(t==='auto')delete root.dataset.theme;else root.dataset.theme=t;
  if(save)ls.set('theme',t);
  const bg=getComputedStyle(document.body).backgroundColor;
  meta.forEach(m=>m.content=t==='auto'?(m.media.includes('dark')?'#101113':'#C6CCCF'):bg);
}
setTheme(ls.get('theme')||'auto',false);

/* key clicks (on by default) */
let ac;function click(){if($('#snd').getAttribute('aria-pressed')!=='true')return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=1800;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.03);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.035)}catch(e){}}
/* tapping the screen: a dull knock on plastic (a short low thump that drops in pitch, plus a muffled tick) */
function thud(){if($('#snd').getAttribute('aria-pressed')!=='true')return;try{ac=ac||new AudioContext();const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.07);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.1);
  const n=ac.createBuffer(1,ac.sampleRate*.03,ac.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**3;
  const src=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();src.buffer=n;f.type='bandpass';f.frequency.value=900;f.Q.value=1.2;ng.gain.value=.25;
  src.connect(f).connect(ng).connect(ac.destination);src.start(t)}catch(e){}}
$('#snd').onclick=()=>{const on=$('#snd').getAttribute('aria-pressed')!=='true';$('#snd').setAttribute('aria-pressed',on);click();toast(on?'Key clicks on':'Key clicks off')};

/* Billie's photo, dithered onto the LCD */
const photo=new Image();photo.src='photos/cat-thumb.jpg';
function showPhoto(){
  const c=$('#shot'),x=c.getContext('2d'),W=c.width,H=c.height;x.drawImage(photo,0,0,W,H);
  const d=x.getImageData(0,0,W,H),p=d.data,B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const ink=getComputedStyle($('#lcd')).color.match(/\d+/g).map(Number);
  for(let i=0;i<W*H;i++){const g=(p[i*4]*.3+p[i*4+1]*.59+p[i*4+2]*.11)*1.1;const t=(B[(i%W%4)+((i/W|0)%4)*4]+.5)*16;
    const on=g<t;p[i*4]=ink[0];p[i*4+1]=ink[1];p[i*4+2]=ink[2];p[i*4+3]=on?255:0}
  x.putImageData(d,0,0);$('#lcd').classList.add('photo');type('> PHOTO 1/1 · TAP TO ENLARGE');
}
function home(){$('#lcd').classList.remove('photo')}

/* presses */
let petTaps=[];
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-app],[data-k]');
  if(k){e.preventDefault();click();k.classList.add('down');setTimeout(()=>k.classList.remove('down'),120);
    if(k.dataset.k==='mode'){const cur=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='light'?(auroraFound?'aurora':'dark'):'light';setTheme(n);home();type('> MODE: '+LABEL[n]);return}
    if(k.dataset.k==='billie'){photo.complete?showPhoto():photo.onload=showPhoto;setMood('awake');return}
    const a=APPS.find(x=>x.id===k.dataset.app);home();setMood('awake',a.think);type('> '+a.name.toUpperCase()+'…');
    setTimeout(()=>{location.href=k.href},60);return}
  if(e.target.closest('#lcd')){
    if($('#lcd').classList.contains('photo')){$('#viewerImg').src='mycat.jpeg';$('#viewer').showModal();return}
    thud();   // the knock is for the main screen only, not the photo
    if(petHold>0){petHold--;return}   // the Aurora screen stays up for 5 taps
    const now=Date.now();petTaps=petTaps.filter(t=>now-t<2500).concat(now);
    if(petTaps.length>=5&&!auroraFound){petTaps=[];auroraFound=true;ls.set('dm1-aurora','1');petHold=5;setTheme('aurora');setMood('happy','♥ ♥ ♥');type('> SECRET: AURORA BACKLIGHT');return}
    const napping=mood==='sleep';setMood('happy','prrr · · ·');type(napping&&!auroraFound?'> HE WAS NAPPING.':'> PRRRRR.')}   // once Aurora is found, every tap purrs
});
$('#vclose').onclick=()=>$('#viewer').close();
$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer'))$('#viewer').close()});

/* on the open phone, drag the speaker grille to move the gadget; it stays on screen and remembers its place (upright and sideways apart) */
const wide=matchMedia('(min-width:560px)'),dev=$('#dev'),grille=$('.grille');
let pos={x:0,y:0},drag=null;
const posKey=()=>'dm1-pos-'+(innerWidth>innerHeight?'sideways':'upright');
function place(save){
  dev.style.transform='';
  if(!wide.matches)return;
  const r=dev.getBoundingClientRect();
  pos.x=Math.round(Math.min(Math.max(pos.x,8-r.left),innerWidth-8-r.right));
  pos.y=Math.round(Math.min(Math.max(pos.y,8-r.top),Math.max(0,innerHeight-8-r.bottom)));
  dev.style.transform=`translate(${pos.x}px,${pos.y}px)`;
  if(save)ls.set(posKey(),JSON.stringify(pos));
}
function load(){try{pos=JSON.parse(ls.get(posKey()))||{x:0,y:0}}catch(e){pos={x:0,y:0}}place()}
grille.addEventListener('pointerdown',e=>{if(!wide.matches)return;sx=null;sdir=0;e.preventDefault();grille.setPointerCapture(e.pointerId);drag={x:e.clientX-pos.x,y:e.clientY-pos.y};dev.classList.add('lifted')});
grille.addEventListener('pointermove',e=>{if(!drag)return;pos={x:e.clientX-drag.x,y:e.clientY-drag.y};place();shaking(e.clientX)});

/* Easter egg: shake it too hard and Billie gets dizzy (fast back-and-forth while dragging); the third time he lies down,
   and the fourth starts over */
let sx=null,sdir=0,flips=[],shakes=0,shakeT=0;
const SHAKE=['> WHOA. WHOA. WHOA.',"> HEY! I'M NOT A SNOW GLOBE.","> THAT'S IT. I'M LYING DOWN."];
function shaking(x){
  if(sx===null){sx=x;return}
  const d=x-sx;if(Math.abs(d)<24)return;
  const dir=Math.sign(d);sx=x;if(dir===sdir)return;
  sdir=dir;const now=Date.now();flips=flips.filter(t=>now-t<1200).concat(now);
  if(flips.length<6||now-shakeT<3000)return;
  flips=[];shakeT=now;const n=shakes++%3+1;
  home();setMood('awake','@ _ @');type(SHAKE[n-1]);
  $('#lcd').classList.remove('glitch');void $('#lcd').offsetWidth;$('#lcd').classList.add('glitch');
  dev.classList.add('rattle');setTimeout(()=>{dev.classList.remove('rattle');$('#lcd').classList.remove('glitch')},900);
  for(let i=0;i<6;i++)setTimeout(click,i*55);
  if(n===3)setTimeout(()=>setMood('sleep'),1800);
}
function drop(){if(!drag)return;drag=null;dev.classList.remove('lifted');place(true)}
grille.addEventListener('pointerup',drop);grille.addEventListener('pointercancel',drop);
addEventListener('resize',load);wide.addEventListener('change',load);load();

/* the gadget has one fixed size; a window narrower than it scales the whole thing down evenly */
function fit(){const w=innerWidth-24;$('#dev').style.zoom=w<358?w/358:''}
fit();addEventListener('resize',fit);
tick();setInterval(tick,15000);batt();setMood('awake');type(greeting());addEventListener('resize',()=>draw(mood));

// Offline: sw.js keeps this page's files. After an update, offer a reload (not on the first install).
if('serviceWorker' in navigator){
  if(navigator.serviceWorker.controller?.scriptURL===new URL('sw.js',location).href)
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      toast('Updated · Tap to reload');clearTimeout(toastT);
      const t=$('#toast');t.classList.add('tap');t.onclick=()=>location.reload();
    },{once:true});
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
