<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="theme-color" content="#0E0A1E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="description" content="Fraction calculator with exact mixed-number math and a history panel. Works offline.">
<style>
  :root{
    --ui:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --ink:#FFFFFF;
    --dim:rgba(255,255,255,.58);
    --faint:rgba(255,255,255,.34);
    --gap:7px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--ui);color:var(--ink);background:#0E0A1E;-webkit-font-smoothing:antialiased}

  /* ---- living backdrop ---- */
  .field{position:fixed;inset:-25%;z-index:0;filter:blur(58px) saturate(150%)}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen}
  .b1{width:74vw;height:74vw;background:#6A3CE0;top:2%;left:-12%;animation:d1 26s ease-in-out infinite}
  .b2{width:66vw;height:66vw;background:#1E9BE0;top:32%;right:-16%;animation:d2 31s ease-in-out infinite}
  .b3{width:58vw;height:58vw;background:#E0603C;bottom:2%;left:8%;animation:d3 24s ease-in-out infinite}
  .b4{width:50vw;height:50vw;background:#17B79A;bottom:20%;right:6%;animation:d1 35s ease-in-out infinite reverse}
  @keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14%,10%) scale(1.16)}}
  @keyframes d2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-16%,-9%) scale(.9)}}
  @keyframes d3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(11%,-13%) scale(1.2)}}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
        background:radial-gradient(120% 80% at 50% 0%,rgba(0,0,0,.18),rgba(0,0,0,.60))}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}

  /* ---- glass ---- */
  .glass{position:relative;background:rgba(255,255,255,.11);
    -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
    border:.5px solid rgba(255,255,255,.30);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.10),
               0 6px 22px rgba(0,0,0,.22);
    overflow:hidden}
  .glass::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.05) 34%,transparent 60%)}

  /* Pinned to the screen's edges. On the home screen iOS makes the page (and so inset:0) shorter than the screen by
     about the status bar and the home bar, which left a gap under the keypad; there 100vh is the whole screen, so the
     home screen app takes that. In Safari 100vh would go under the toolbar, so the page keeps inset:0. */
  #app{position:fixed;inset:0;z-index:2;
       display:flex;flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px)}

  /* ---- display ---- */
  /* iOS 26 home screen apps (WebKit bug 301108): a page shorter than the screen gets a viewport that stops short by
     the status bar, and nothing shows under it. A page at least the screen's height gets the whole screen. */
  @media (display-mode:standalone){
    html{height:auto;min-height:min(100lvh,calc(100% + env(safe-area-inset-top)))}
    body{height:auto;min-height:100%}
    #app{bottom:auto;height:100vh;padding-top:calc(env(safe-area-inset-top) + 20px)}   /* below the haze iOS 26.1 puts behind the status bar */
  }
  .display{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;
           padding:16px 16px 15px;border-radius:26px;margin-bottom:9px}
  .expr{font-size:15px;color:var(--dim);text-align:right;min-height:20px;font-variant-numeric:tabular-nums}
  .value{text-align:right;line-height:.95;margin-top:8px;font-size:clamp(42px,14vw,64px);
         font-weight:300;letter-spacing:-.025em;font-variant-numeric:tabular-nums;
         text-shadow:0 1px 14px rgba(0,0,0,.28);word-break:break-word}
  .value.err{font-size:17px;font-weight:500;color:#FFD08A;letter-spacing:0}
  .fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.42em;line-height:1.06;
      vertical-align:.44em;margin-left:.14em;font-weight:500}
  .fr .den{border-top:1.5px solid currentColor;padding-top:1px;margin-top:1px}
  .fr.nlit .top{color:#7FE7F5}
  .fr.dlit .den{color:#C9A8FF}
  .alt{text-align:right;font-size:12px;color:var(--faint);margin-top:11px;min-height:16px;
       font-variant-numeric:tabular-nums}
  .alt b{color:var(--dim);font-weight:500}
  .alt .sep{padding:0 6px;opacity:.45}

  /* ---- hamburger ---- */
  .menu{position:absolute;top:13px;left:13px;width:40px;height:40px;border-radius:14px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
        cursor:pointer;z-index:3;border:.5px solid rgba(255,255,255,.28)}
  .menu i{display:block;width:16px;height:1.6px;border-radius:1px;background:rgba(255,255,255,.85)}
  .menu:active{transform:scale(.92)}
  .dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:#FFC15E;
       box-shadow:0 0 7px rgba(255,193,94,.9);opacity:0;transition:opacity .2s}
  .dot.on{opacity:1}

  /* ---- keypad ---- */
  .pad{flex:0 1 auto;min-height:0;height:clamp(420px,65vh,610px);display:grid;
       grid-template-columns:1.85fr 2.75fr 1fr;gap:var(--gap)}
  .zone{display:grid;gap:var(--gap);min-height:0}
  .zone.whole{grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,1fr)}
  .zone.ops{grid-template-rows:repeat(6,1fr)}
  .frac{display:flex;flex-direction:column;gap:var(--gap);min-height:0}
  .subpad{flex:1 1 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
          gap:var(--gap);min-height:0}
  .subpad .wide{grid-column:span 2}

  .bar{flex:0 0 auto;height:7px;border-radius:3.5px;margin:3px 0;background:linear-gradient(90deg,#40D0E8,#A878FF);position:relative;
       box-shadow:0 0 14px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.9)}

  button{font-family:var(--ui);font-weight:300;color:var(--ink);
         border-radius:21px;border:.5px solid rgba(255,255,255,.26);
         background:rgba(255,255,255,.13);
         -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.40),0 3px 12px rgba(0,0,0,.18);
         display:flex;align-items:center;justify-content:center;
         cursor:pointer;touch-action:manipulation;user-select:none;min-width:0;min-height:0;
         text-shadow:0 1px 6px rgba(0,0,0,.3);
         transition:transform .08s ease,filter .08s ease}
  button:active{transform:scale(.94);filter:brightness(1.45)}
  button:focus-visible{outline:2px solid #FFC15E;outline-offset:2px}

  .zone.whole button{font-size:clamp(24px,6.6vw,32px)}
  .subpad button{font-size:clamp(19px,5.2vw,25px);border-radius:17px}
  .zone.ops button{font-size:clamp(24px,6.6vw,32px);font-weight:400}

  .zone.ops button{background:rgba(72,146,255,.26);border-color:rgba(150,196,255,.40)}
  .zone.ops button.clear{background:rgba(255,92,92,.28);border-color:rgba(255,160,160,.42);
                         font-size:21px;font-weight:500}
  .zone.ops button.eq{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent) rgba(255,166,48,.42);border-color:rgba(255,206,140,.55);font-weight:500}
  .subpad button.del{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
                     color:rgba(255,255,255,.72)}
  .zone.whole button.sym{font-size:21px;color:rgba(255,255,255,.72)}

  /* ---- history panel ---- */
  .scrim{position:fixed;inset:0;z-index:8;background:rgba(6,3,16,.5);opacity:0;pointer-events:none;
         transition:opacity .26s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;bottom:0;left:0;z-index:9;width:min(350px,87vw);
         border-radius:0 26px 26px 0;border-left-style:none;
         display:flex;flex-direction:column;
         transform:translateX(-101%);transition:transform .3s cubic-bezier(.3,.9,.25,1)}
  .panel.on{transform:translateX(0)}
  @media (prefers-reduced-motion:reduce){.panel{transition:none}.scrim{transition:none}}

  /* ---- full width at every size; wide and short screens (iPhone Duo: open 669×867 / 951×585, closed sideways 594×368) ---- */
  @media (orientation:portrait){ .pad{height:clamp(420px,72vh,680px)} }
  @media (orientation:landscape) and (min-width:800px){
    .panel{transform:none;width:min(320px,34vw);transition:none}
    .scrim,#menuBtn{display:none}
    #app{margin-left:min(320px,34vw)}
  }
  @media (max-height:500px){
    #app{--gap:5px;padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
    .display{flex:0 0 auto;padding:8px 14px 7px;margin-bottom:5px;border-radius:20px}
    .expr{min-height:16px;font-size:13px}
    .value{font-size:34px;margin-top:0}
    .alt{margin-top:2px;min-height:14px}
    .menu{top:9px;left:9px}
    .display{padding-left:62px}
    .pad{flex:1 1 0;height:auto}
    .zone.whole button,.zone.ops button{font-size:24px}
    .subpad button{font-size:19px}
  }
  .phead{flex:0 0 auto;display:flex;align-items:center;gap:7px;
         padding:calc(env(safe-area-inset-top) + 16px) 15px 13px;
         border-bottom:.5px solid rgba(255,255,255,.16)}
  .ptitle{flex:1;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .pill{flex:0 0 auto;height:32px;padding:0 14px;border-radius:16px;font-size:12.5px;font-weight:600;
        letter-spacing:.02em;background:rgba(255,255,255,.16);border:.5px solid rgba(255,255,255,.3)}
  .pill.danger{background:rgba(255,92,92,.26);border-color:rgba(255,160,160,.4)}
  .rows{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
        padding:10px 12px 10px}
  .row{width:100%;display:block;text-align:right;padding:12px 14px;margin-bottom:8px;
       border-radius:17px;background:rgba(255,255,255,.09);border:.5px solid rgba(255,255,255,.17);
       box-shadow:none;font-weight:300}
  .row:active{transform:scale(.98);filter:brightness(1.3)}
  .rexpr{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-bottom:3px}
  .rres{font-size:27px;line-height:1.05;font-variant-numeric:tabular-nums}
  .rres .fr{font-size:.44em;vertical-align:.42em}
  .empty{padding:40px 22px;text-align:center;font-size:13px;color:var(--faint);line-height:1.55}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:20;
         transform:translate(-50%,14px);opacity:0;pointer-events:none;
         padding:11px 20px;border-radius:20px;font-size:13px;font-weight:500;
         background:rgba(20,14,42,.82);border:.5px solid rgba(255,255,255,.26);
         -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
         transition:opacity .22s,transform .22s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.tap{pointer-events:auto;cursor:pointer}

  .pfoot{flex:0 0 auto;display:flex;justify-content:center;padding:8px 15px calc(env(safe-area-inset-bottom) + 14px)}
  .pfoot a{color:var(--dim);text-decoration:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:14px;
           border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
  body[data-theme="day"] .pfoot a{border-color:rgba(0,0,0,.12);background:rgba(0,0,0,.04)}

  /* ---- theme picker ---- */
  .ptheme{flex:0 0 auto;padding:12px 15px 4px}
  .plabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
          color:var(--faint);margin-bottom:8px}
  [hidden]{display:none!important}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .seg button{height:36px;border-radius:13px;font-size:13px;font-weight:600;letter-spacing:.01em;
              background:rgba(255,255,255,.09);border:.5px solid rgba(255,255,255,.18);
              box-shadow:none;text-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .seg button.sel{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.5)}

  /* ============ NIGHT (OLED blackout) ============ */
  body[data-theme="night"]{background:#141517;--ink:#E6E7E9;--dim:#A0A3A9;--faint:rgba(230,231,233,.38)}
  body[data-theme="night"] .field,
  body[data-theme="night"] .veil{display:none}
  body[data-theme="night"] .glass{background:#1F2023;
    border-color:rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 22px rgba(0,0,0,.55)}
  body[data-theme="night"] .glass::before{background:none}
  body[data-theme="night"] .value{text-shadow:none}
  body[data-theme="night"] .value.err{color:#FEA362}
  body[data-theme="night"] .fr.nlit .top{color:#6CC3E0}
  body[data-theme="night"] .fr.dlit .den{color:#B8ACF6}
  body[data-theme="night"] .pad button{background:#1F2023;border-color:rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);text-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  body[data-theme="night"] .zone.ops button{background:#1C2B41;
    border-color:rgba(87,157,255,.45);color:#85B8FF}
  body[data-theme="night"] .zone.ops button.clear{background:rgba(248,113,104,.16);
    border-color:rgba(248,113,104,.45);color:#FD9891}
  body[data-theme="night"] .zone.ops button.eq{background:linear-gradient(180deg,rgba(255,255,255,.22),transparent) #579DFF;border-color:#85B8FF;color:#141517}
  body[data-theme="night"] .bar{background:linear-gradient(90deg,#6CC3E0,#B8ACF6);box-shadow:none}
  body[data-theme="night"] .pill.danger{background:rgba(248,113,104,.16);border-color:rgba(248,113,104,.45);color:#FD9891}
  body[data-theme="night"] .toast{background:rgba(30,31,34,.97)}
  body[data-theme="night"] .seg button.sel{background:#1C2B41;
    border-color:#579DFF;color:#85B8FF}

  /* ============ DAY (light) ============ */
  body[data-theme="day"]{background:#F4F4F5;
    --ink:#1E2126;--dim:#60646C;--faint:rgba(0,0,0,.34)}
  body[data-theme="day"] .field,
  body[data-theme="day"] .veil{display:none}
  body[data-theme="day"] .glass{background:linear-gradient(180deg,#fff,#FAFAFA);
    border-color:rgba(0,0,0,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.05)}
  body[data-theme="day"] .glass::before{background:none}
  body[data-theme="day"] .value{text-shadow:none}
  body[data-theme="day"] .value.err{color:#C25100}
  body[data-theme="day"] .menu i{background:rgba(0,0,0,.7)}
  body[data-theme="day"] .menu{border-color:rgba(0,0,0,.14)}
  body[data-theme="day"] .fr.nlit .top{color:#227D9B}
  body[data-theme="day"] .fr.dlit .den{color:#6E5DC6}
  body[data-theme="day"] .pad button{background:#FFFFFF;border-color:rgba(0,0,0,.09);
    box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);text-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  body[data-theme="day"] .bar{background:linear-gradient(90deg,#227D9B,#6E5DC6);box-shadow:none}
  body[data-theme="day"] .subpad button.del,
  body[data-theme="day"] .zone.whole button.sym{color:#60646C}
  body[data-theme="day"] .zone.ops button{background:#E9F2FF;
    border-color:rgba(12,102,228,.28);color:#0C66E4}
  body[data-theme="day"] .zone.ops button.clear{background:#FFECEB;
    border-color:rgba(201,55,44,.35);color:#AE2E24}
  body[data-theme="day"] .zone.ops button.eq{background:linear-gradient(180deg,rgba(255,255,255,.22),transparent) #0C66E4;border-color:#0055CC;color:#fff}
  body[data-theme="day"] .scrim{background:rgba(0,0,0,.28)}
  body[data-theme="day"] .row{background:rgba(0,0,0,.045);border-color:rgba(0,0,0,.10)}
  body[data-theme="day"] .pill{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.14)}
  body[data-theme="day"] .pill.danger{background:#FFECEB;border-color:rgba(201,55,44,.35);color:#AE2E24}
  body[data-theme="day"] .phead{border-bottom-color:rgba(0,0,0,.12)}
  body[data-theme="day"] .toast{background:rgba(255,255,255,.97);color:#1E2126;border-color:rgba(0,0,0,.12)}
  body[data-theme="day"] .seg button{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12)}
  body[data-theme="day"] .seg button.sel{background:#E9F2FF;border-color:#0C66E4;color:#0C66E4}
</style>
</head>
<body>
<script>
var t="auto";
try{
  t=localStorage.getItem("theme")||localStorage.getItem("calculator.theme")||"auto";
  t={day:"light",night:"dark"}[t]||t;
}catch(e){}
if(t==="auto") t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
if(t==="light") document.body.dataset.theme="day";
if(t==="dark") document.body.dataset.theme="night";
</script>

<div class="field">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
</div>
<div class="veil"></div>

<div class="scrim" id="scrim"></div>

<aside class="panel glass" id="panel" aria-label="History">
  <div class="phead">
    <div class="ptitle">History</div>
    <button class="pill" id="copyBtn">Copy</button>
    <button class="pill danger" id="wipeBtn">Clear</button>
  </div>
  <div class="ptheme">
    <div class="plabel" id="themeLabel" data-theme-label>Theme</div>
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button data-t="auto">Auto</button>
      <button data-t="day">Day</button>
      <button data-t="night">Night</button>
      <button data-t="aurora" hidden>Aurora</button>
    </div>
  </div>
  <div class="rows" id="rows"></div>
  <div class="pfoot"><a href="../">&lsaquo; dorrance.me</a></div>
</aside>

<div id="app">

  <div class="display glass">
    <button class="menu glass" id="menuBtn" aria-label="History" aria-expanded="false">
      <i></i><i></i><i></i><span class="dot" id="dot"></span>
    </button>
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
    <div class="alt" id="alt"></div>
  </div>

  <div class="pad">

    <div class="zone whole" aria-label="Whole number">
      <button data-k="w9">9</button><button data-k="w8">8</button>
      <button data-k="w7">7</button><button data-k="w6">6</button>
      <button data-k="w5">5</button><button data-k="w4">4</button>
      <button data-k="w3">3</button><button data-k="w2">2</button>
      <button data-k="w1">1</button><button data-k="w0">0</button>
      <button class="sym" data-k="neg" aria-label="Positive or negative">&plusmn;</button>
      <button class="sym" data-k="wdot" aria-label="Decimal point">.</button>
    </div>

    <div class="frac">
      <div class="subpad num" aria-label="Numerator">
        <button data-k="n7">7</button><button data-k="n8">8</button><button data-k="n9">9</button>
        <button data-k="n4">4</button><button data-k="n5">5</button><button data-k="n6">6</button>
        <button data-k="n1">1</button><button data-k="n2">2</button><button data-k="n3">3</button>
        <button data-k="n0">0</button><button class="wide del" data-k="ndel">del</button>
      </div>

      <div class="bar"></div>

      <div class="subpad den" aria-label="Denominator">
        <button data-k="d7">7</button><button data-k="d8">8</button><button data-k="d9">9</button>
        <button data-k="d4">4</button><button data-k="d5">5</button><button data-k="d6">6</button>
        <button data-k="d1">1</button><button data-k="d2">2</button><button data-k="d3">3</button>
        <button data-k="d0">0</button><button class="wide del" data-k="ddel">del</button>
      </div>
    </div>

    <div class="zone ops">
      <button class="clear" data-k="clear" id="clearKey">AC</button>
      <button data-k="&divide;">&divide;</button>
      <button data-k="&times;">&times;</button>
      <button data-k="&minus;">&minus;</button>
      <button data-k="+">+</button>
      <button class="eq" data-k="=">=</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ================= exact rational arithmetic ================= */
  /* The work is in BigInt, so nothing rounds on the way. A result too big for an exact number is BIG. */
  var Z=BigInt(0), ONE=BigInt(1), BIG={big:true};
  function B(x){return BigInt(x);}
  function gcd(a,b){if(a<Z)a=-a;if(b<Z)b=-b;while(b){var t=b;b=a%b;a=t;}return a;}
  function F(n,d){
    n=B(n); d=B(d); if(d===Z) return null; if(d<Z){n=-n;d=-d;}
    var g=gcd(n,d)||ONE, N=Number(n/g), D=Number(d/g);
    return Number.isSafeInteger(N)&&Number.isSafeInteger(D)?{n:N,d:D}:BIG;
  }
  function add(a,b){return F(B(a.n)*B(b.d)+B(b.n)*B(a.d),B(a.d)*B(b.d));}
  function sub(a,b){return F(B(a.n)*B(b.d)-B(b.n)*B(a.d),B(a.d)*B(b.d));}
  function mul(a,b){return F(B(a.n)*B(b.n),B(a.d)*B(b.d));}
  function dvd(a,b){return b.n===0?null:F(B(a.n)*B(b.d),B(a.d)*B(b.n));}
  function apply(o,a,b){return o==="+"?add(a,b):o==="\u2212"?sub(a,b):o==="\u00d7"?mul(a,b):dvd(a,b);}
  function isPow2(d){return (d&(d-1))===0;}

  /* Standard order: × and ÷ before + and −. A chain is terms [{v, op}], each value with the operator after it;
     the last op is not used. The answer is a fraction, null (divide by zero) or BIG. */
  function mulOp(o){return o==="\u00d7"||o==="\u00f7";}
  function evalTerms(list){
    var total=null, addOp="+", run=list[0].v;
    for(var i=1;i<list.length;i++){
      var o=list[i-1].op;
      if(mulOp(o)){ run=apply(o,run,list[i].v); if(!run||run===BIG) return run; }
      else { total=total===null?run:apply(addOp,total,run); if(total===BIG) return BIG; addOp=o; run=list[i].v; }
    }
    return total===null?run:apply(addOp,total,run);
  }
  // What the display shows while a chain is open: all of it after + or −; after × or ÷ only the run of × and ÷
  // at the end, since a later × or ÷ still belongs to it.
  function shown(list){
    var last=list.length-1, start=0;
    if(mulOp(list[last].op)) for(var i=last-1;i>=0;i--) if(!mulOp(list[i].op)){ start=i+1; break; }
    return evalTerms(list.slice(start));
  }

  /* ================= state ================= */
  var cur={w:"",n:"",d:"",neg:false};
  var acc=null, terms=[], justEq=false, err=null;   // acc: the value on show when nothing is being typed
  var parts=[];
  var hist=[];

  /* history is stored on this device only, under this web address */
  try{
    var raw=localStorage.getItem("calculator.hist");
    if(raw) hist=JSON.parse(raw)||[];
  }catch(e){ hist=[]; }
  function save(){ try{ localStorage.setItem("calculator.hist",JSON.stringify(hist)); }catch(e){} }

  var exprEl=document.getElementById("expr"),
      valEl=document.getElementById("value"),
      altEl=document.getElementById("alt"),
      clearKey=document.getElementById("clearKey"),
      rowsEl=document.getElementById("rows"),
      panel=document.getElementById("panel"),
      scrim=document.getElementById("scrim"),
      menuBtn=document.getElementById("menuBtn"),
      dot=document.getElementById("dot"),
      toastEl=document.getElementById("toast");

  function blank(){return cur.w===""&&cur.n===""&&cur.d===""&&!cur.neg;}
  function reset(){cur={w:"",n:"",d:"",neg:false};}

  function curFrac(){
    var n=cur.n===""?0:parseInt(cur.n,10);
    var d=cur.d===""?1:parseInt(cur.d,10);
    if(d===0) return null;
    var wf;
    if(cur.w.indexOf(".")>-1){
      var f2=cur.w.split(".")[1]||"", p=Math.pow(10,f2.length);
      wf=F(Math.round(parseFloat(cur.w)*p),p);
    } else wf=F(cur.w===""?0:parseInt(cur.w,10),1);
    var f=add(wf,F(n,d));
    if(cur.neg) f={n:-f.n,d:f.d};
    return f;
  }

  /* ================= formatting ================= */
  function frGlyph(n,d,cls){
    return '<span class="fr '+(cls||"")+'"><span class="top">'+n+'</span><span class="den">'+d+'</span></span>';
  }
  function mixedHTML(f){
    var s=f.n<0?"\u2212":"", n=Math.abs(f.n), w=Math.floor(n/f.d), r=n-w*f.d;
    if(r===0) return s+w;
    if(w===0) return s+frGlyph(r,f.d);
    return s+w+frGlyph(r,f.d);
  }
  function mixedText(f){
    var s=f.n<0?"\u2212":"", n=Math.abs(f.n), w=Math.floor(n/f.d), r=n-w*f.d;
    if(r===0) return s+w;
    if(w===0) return s+r+"/"+f.d;
    return s+w+" "+r+"/"+f.d;
  }
  function entryHTML(){
    var out=cur.neg?"\u2212":"";
    if(cur.w!=="") out+=cur.w;
    if(cur.n!==""||cur.d!==""){
      out+=frGlyph(cur.n===""?"\u00b7":cur.n, cur.d===""?"\u00b7":cur.d,
                   (cur.n===""?"":"nlit")+" "+(cur.d===""?"":"dlit"));
    }
    return out===""?"0":out;
  }

  /* ================= toast ================= */
  var toastT;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add("on"); toastEl.classList.remove("tap"); toastEl.onclick=null;
    clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("on");},1900);
  }

  /* ================= history ================= */
  function pushHist(expr,res){
    hist.unshift({expr:expr,res:res});
    if(hist.length>200) hist.pop();
    save(); paintHist();
    if(!panel.classList.contains("on")) dot.classList.add("on");
  }

  function paintHist(){
    if(!hist.length){
      rowsEl.innerHTML='<div class="empty">Nothing yet.<br>Results land here when you press&nbsp;=</div>';
      return;
    }
    var html="";
    for(var i=0;i<hist.length;i++){
      html+='<button class="row" data-i="'+i+'">'+
              '<div class="rexpr">'+hist[i].expr+'</div>'+
              '<div class="rres">'+mixedHTML(hist[i].res)+'</div>'+
            '</button>';
    }
    rowsEl.innerHTML=html;
  }

  function histText(){
    var lines=["Fraction calculations",""];
    for(var i=hist.length-1;i>=0;i--) lines.push(hist[i].expr+" = "+mixedText(hist[i].res));
    return lines.join("\n");
  }

  function legacyCopy(text){
    var ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,text.length);
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyHist(){
    if(!hist.length){ toast("Nothing to copy yet"); return; }
    var text=histText(), n=hist.length;
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(
        function(){ toast("Copied \u2014 "+n+" calculations"); },
        function(){ toast(legacyCopy(text)?"Copied \u2014 "+n+" calculations":"Couldn't reach the clipboard"); });
    } else {
      toast(legacyCopy(text)?"Copied \u2014 "+n+" calculations":"Couldn't reach the clipboard");
    }
  }

  function openPanel(){ panel.classList.add("on"); scrim.classList.add("on");
                        menuBtn.setAttribute("aria-expanded","true"); dot.classList.remove("on"); }
  function closePanel(){ panel.classList.remove("on"); scrim.classList.remove("on");
                         menuBtn.setAttribute("aria-expanded","false"); }

  menuBtn.addEventListener("click",function(){
    panel.classList.contains("on")?closePanel():openPanel();
  });
  scrim.addEventListener("click",closePanel);
  document.getElementById("copyBtn").addEventListener("click",copyHist);
  document.getElementById("wipeBtn").addEventListener("click",function(){
    if(!hist.length){ toast("History is already empty"); return; }
    hist=[]; save(); paintHist(); toast("History cleared");
  });
  rowsEl.addEventListener("click",function(e){
    var row=e.target.closest?e.target.closest(".row"):null;
    if(!row) return;
    var h=hist[+row.dataset.i];
    acc=h.res; terms=[]; parts=[]; reset(); justEq=true; err=null;
    closePanel(); render();
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePanel(); });

  /* ================= themes ================= */
  var themeSeg=document.getElementById("themeSeg");
  var themeMeta=document.querySelector('meta[name="theme-color"]');
  var THEME_BG={day:"#F4F4F5",night:"#141517",aurora:"#0E0A1E"};

  var darkMQ=matchMedia("(prefers-color-scheme: dark)");
  var themePref="auto";
  /* one theme setting is shared by every app on this site: auto | light | dark | aurora */
  var TO_SHARED={day:"light",night:"dark"}, FROM_SHARED={light:"day",dark:"night"};
  try{
    themePref=localStorage.getItem("theme")||localStorage.getItem("calculator.theme")||"auto";
    themePref=FROM_SHARED[themePref]||themePref;
    localStorage.removeItem("calculator.theme");
  }catch(e){}

  // t = auto | day | night | aurora; Auto follows the device's light/dark setting.
  // Aurora is secret: the picker shows Auto, Day and Night. Five taps on the "Theme" label
  // within 2 seconds turn Aurora on, and its button shows, selected, until another theme is picked.
  function setTheme(t){
    themePref=t;
    var mode=t==="auto"?(darkMQ.matches?"night":"day"):t;
    if(mode==="aurora") delete document.body.dataset.theme;
    else document.body.dataset.theme=mode;
    if(themeMeta) themeMeta.setAttribute("content",THEME_BG[mode]||THEME_BG.aurora);
    themeSeg.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("sel",b.dataset.t===t);
      if(b.dataset.t==="aurora") b.hidden=t!=="aurora";
    });
    try{ localStorage.setItem("theme",TO_SHARED[t]||t); }catch(e){}
  }
  window.addEventListener("storage",function(e){
    if(e.key==="theme"&&e.newValue) setTheme(FROM_SHARED[e.newValue]||e.newValue);
  });
  darkMQ.addEventListener("change",function(){ if(themePref==="auto") setTheme("auto"); });
  themeSeg.addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("button"):null;
    if(b) setTheme(b.dataset.t);
  });
  var taps=[];
  document.getElementById("themeLabel").addEventListener("click",function(){
    var now=Date.now();
    taps=taps.filter(function(x){return now-x<2000;}).concat(now);
    if(taps.length<5) return;
    taps=[]; setTheme("aurora"); toast("Aurora");
  });
  setTheme(themePref);

  /* ================= render ================= */
  function render(){
    clearKey.textContent=(blank()&&acc===null)?"AC":"C";

    if(err){
      exprEl.textContent="";
      valEl.className="value err"; valEl.textContent=err;
      altEl.innerHTML=""; return;
    }

    exprEl.textContent=parts.join(" ");

    var live;
    if(!blank()){ live=curFrac(); valEl.innerHTML=entryHTML(); }
    else { live=acc; valEl.innerHTML = acc!==null ? mixedHTML(acc) : "0"; }
    valEl.className="value";

    if(!live){ altEl.innerHTML=""; return; }
    var dec=live.n/live.d;
    var bits=['<b>'+live.n+"/"+live.d+'</b>',
              dec.toFixed(4).replace(/0+$/,"").replace(/\.$/,"")];
    var near=F(Math.round(dec*16),16);
    if((!isPow2(live.d)||live.d>64)&&near!==BIG){
      bits.push('\u2248 '+mixedText(near)+' to 1/16');
    }
    altEl.innerHTML=bits.join('<span class="sep">\u00b7</span>');
  }

  /* ================= input ================= */
  function press(k){
    if(err && k!=="clear") err=null;

    if(k==="clear"){
      if(!blank()) reset(); else { acc=null; terms=[]; parts=[]; }
      err=null; justEq=false; render(); return;
    }
    if(k==="wdel"){ cur.w=cur.w.slice(0,-1); render(); return; }
    if(k==="ndel"){ cur.n=cur.n.slice(0,-1); render(); return; }
    if(k==="ddel"){ cur.d=cur.d.slice(0,-1); render(); return; }
    if(k==="neg"){ cur.neg=!cur.neg; render(); return; }

    if(k==="="){
      var v = blank() ? (acc||F(0,1)) : curFrac();
      if(!v){ err="A denominator can't be zero."; reset(); render(); return; }
      var full=parts.concat([blank() ? (acc?mixedText(acc):"0") : mixedText(v)]);
      var r = terms.length ? evalTerms(terms.concat([{v:v,op:null}])) : v;
      if(!r||r===BIG){ err=r?"Too big to show exactly.":"Can't divide by zero."; reset(); terms=[]; parts=[]; render(); return; }
      if(parts.length) pushHist(full.join(" "),r);
      acc=r; terms=[]; parts=[]; reset(); justEq=true; render(); return;
    }

    if("+\u2212\u00d7\u00f7".indexOf(k)>-1){
      if(blank()){
        if(terms.length){ terms[terms.length-1].op=k; parts[parts.length-1]=k; }   // a change of operator
        else if(acc!==null){ terms=[{v:acc,op:k}]; parts=[mixedText(acc),k]; }       // go on from the answer
        else { justEq=false; render(); return; }
      } else {
        var val=curFrac();
        if(!val){ err="A denominator can't be zero."; reset(); render(); return; }
        parts.push(mixedText(val)); parts.push(k);
        terms.push({v:val,op:k}); reset();
      }
      var res=shown(terms);
      if(!res||res===BIG){ err=res?"Too big to show exactly.":"Can't divide by zero."; reset(); terms=[]; parts=[]; render(); return; }
      acc=res;
      justEq=false; render(); return;
    }

    if(justEq){ acc=null; terms=[]; parts=[]; reset(); justEq=false; }

    var field=k.charAt(0), ch=k.slice(1);
    if(field==="w"){
      if(ch==="dot"){ if(cur.w.indexOf(".")<0) cur.w=(cur.w===""?"0.":cur.w+"."); }
      else if(cur.w.replace(".","").length<7){ cur.w=(cur.w==="0"?"":cur.w)+ch; }
    } else if(field==="n"){
      if(cur.n.length<4) cur.n=(cur.n==="0"?"":cur.n)+ch;
    } else if(field==="d"){
      if(cur.d.length<4) cur.d=(cur.d==="0"?"":cur.d)+ch;
    }
    render();
  }

  document.querySelectorAll(".pad button").forEach(function(b){
    b.addEventListener("click",function(){ press(b.dataset.k); });
  });

  /* keyboard: digits fill the whole number; space moves to the numerator,
     "/" to the denominator (type "1 3/4"); + - * for operators, ":" or "?" to divide;
     Enter = equals, Backspace deletes, Escape clears */
  var kf="w";
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea") return;
    var k=e.key, h=true;
    if(k>="0"&&k<="9"){ press(kf+k); }
    else if(k==="."){ if(kf==="w") press("wdot"); }
    else if(k===" "){ if(!blank()||justEq) kf="n"; }
    else if(k==="/"){
      if(kf==="w"&&cur.n===""&&cur.w.indexOf(".")<0){ cur.n=cur.w; cur.w=""; }
      kf="d"; render();
    }
    else if(k==="+"){ press("+"); kf="w"; }
    else if(k==="-"){ press("\u2212"); kf="w"; }
    else if(k==="*"||k==="x"||k==="X"){ press("\u00d7"); kf="w"; }
    else if(k===":"||k==="?"){ press("\u00f7"); kf="w"; }
    else if(k==="Enter"||k==="="){ press("="); kf="w"; }
    else if(k==="Backspace"){
      if(kf==="d"&&cur.d==="") kf="n";
      if(kf==="n"&&cur.n==="") kf="w";
      press(kf+"del");
    }
    else if(k==="Escape"){ if(panel.classList.contains("on")) closePanel(); else press("clear"); kf="w"; }
    else if(k==="n"||k==="N"){ press("neg"); }
    else h=false;
    if(h) e.preventDefault();
  });
  var _press=press;
  press=function(k){ if(k==="clear"||k==="=") kf="w"; _press(k); };

  paintHist();
  render();

  /* keeps it working with no signal; after an update, offer a reload (not on the first install) */
  if("serviceWorker" in navigator){
    var ctl=navigator.serviceWorker.controller;
    if(ctl&&ctl.scriptURL===new URL("sw.js",location).href)
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        toast("Updated · Tap to reload"); clearTimeout(toastT);
        toastEl.classList.add("tap"); toastEl.onclick=function(){location.reload()};
      },{once:true});
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
