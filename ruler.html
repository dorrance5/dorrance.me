<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Screen Ruler</title>
<style>
/* unlinked page: measures what Safari gives dorrance.me pages on the owner's phone (feeds test/devices.cjs) */
:root{--bg:#F7F4EE;--panel:#FFF;--ink:#1E1B16;--soft:#6A6258;--line:#E3DCCF;--accent:#B4452C;--on-accent:#FFF}
@media (prefers-color-scheme:dark){:root{--bg:#17140F;--panel:#221E18;--ink:#F2ECE2;--soft:#A79E91;--line:#3A342B;--accent:#F08A6C;--on-accent:#17140F;color-scheme:dark}}
@media (display-mode:standalone){html{min-height:100lvh}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--soft)}
.big{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.wh{font:700 40px/1.05 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 0;font:15px/1.4 ui-monospace,Menlo,monospace}
dt{color:var(--soft)} dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:grid;gap:4px;font-size:14px;color:var(--soft);flex:1 1 220px}
select,button,input{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px}
button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
ol{margin:0;padding-left:22px;display:grid;gap:6px;font:13px/1.4 ui-monospace,Menlo,monospace}
textarea{width:100%;box-sizing:border-box;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
#msg{min-height:1.4em;color:var(--accent);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Screen Ruler</h1>
  <p>For each pose, pick it and tap Save. Do it in Safari, and again from a Home Screen icon if you use one. Tap the field below and Save "keyboard up" too. Then Copy all and paste it to Claude.</p>
  <section class="big" aria-live="polite">
    <span class="lbl">Page size (CSS px)</span>
    <span class="wh" id="wh">–</span>
    <dl>
      <dt>Visible</dt><dd id="vv">–</dd>
      <dt>Mode</dt><dd id="mode">–</dd>
      <dt>Safe areas</dt><dd id="safe">–</dd>
      <dt>Pixel ratio</dt><dd id="dpr">–</dd>
    </dl>
  </section>
  <div class="row">
    <label for="pose">Pose
      <select id="pose">
        <option>Closed, upright</option>
        <option>Closed, sideways</option>
        <option>Open, upright</option>
        <option>Open, sideways</option>
        <option>Open, split screen</option>
        <option>Closed, upright, keyboard up</option>
        <option>Open, upright, keyboard up</option>
        <option>Open, sideways, keyboard up</option>
      </select>
    </label>
    <button class="go" id="save" type="button">Save</button>
  </div>
  <label for="kb">Tap here to raise the keyboard
    <input id="kb" type="text" enterkeyhint="done" autocomplete="off">
  </label>
  <ol id="log"></ol>
  <div class="row">
    <button id="copy" type="button">Copy all</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <div id="msg" role="status"></div>
  <textarea id="out" readonly aria-label="Readings as text"></textarea>
</main>
<div id="probe" style="position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>
<script>
const $ = id => document.getElementById(id), KEY = 'ruler-readings';
let saved = [];
try { saved = JSON.parse(localStorage.getItem(KEY) || '[]') } catch (e) {}
const read = () => {
  const v = visualViewport, p = getComputedStyle($('probe')), n = s => Math.round(parseFloat(s) || 0);
  return {
    page: innerWidth + 'x' + innerHeight,
    visible: v ? Math.round(v.width) + 'x' + Math.round(v.height) + ' top ' + Math.round(v.offsetTop) : 'n/a',
    mode: matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'home screen' : 'Safari',
    safe: 't' + n(p.paddingTop) + ' r' + n(p.paddingRight) + ' b' + n(p.paddingBottom) + ' l' + n(p.paddingLeft),
    dpr: devicePixelRatio
  };
};
const show = () => { const r = read(); $('wh').textContent = r.page.replace('x', ' × '); $('vv').textContent = r.visible; $('mode').textContent = r.mode; $('safe').textContent = r.safe; $('dpr').textContent = r.dpr };
const line = s => `${s.pose} (${s.mode}): page ${s.page}, visible ${s.visible}, safe ${s.safe}, @${s.dpr}x`;
const draw = () => {
  $('log').innerHTML = '';
  saved.forEach(s => { const li = document.createElement('li'); li.textContent = line(s); $('log').append(li) });
  $('out').value = saved.length ? ['dorrance.me ruler', navigator.userAgent, ...saved.map(line)].join('\n') : '';
};
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)) } catch (e) {} };
// Save keeps the keyboard up: pointerdown preventDefault stops the button from taking focus
$('save').addEventListener('pointerdown', e => e.preventDefault());
$('save').onclick = () => {
  const s = { pose: $('pose').value, ...read() };
  saved = saved.filter(x => x.pose !== s.pose || x.mode !== s.mode).concat(s);
  store(); draw(); $('msg').textContent = 'Saved: ' + s.pose;
};
$('clear').onclick = () => { saved = []; store(); draw(); $('msg').textContent = 'Cleared' };
$('copy').onclick = () => {
  const t = $('out').value, pick = () => { $('out').select(); $('msg').textContent = 'Selected. Use Copy from the menu.' };
  if (!navigator.clipboard) return pick();
  navigator.clipboard.writeText(t).then(() => $('msg').textContent = 'Copied', pick);
};
addEventListener('resize', show);
visualViewport && visualViewport.addEventListener('resize', show);
visualViewport && visualViewport.addEventListener('scroll', show);
show(); draw();
</script>
</body>
</html>
