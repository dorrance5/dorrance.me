<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Counter">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141517">
<!-- The theme before the first paint, as App.init sets it, so a dark phone does not flash Day. -->
<script>try{var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t!=='light')document.documentElement.dataset.mode=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="description" content="Tally counters with colors and sorting. Works offline.">
<title>Counter</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Each counter is a card in its color, like the colored result cards in TV Mount:
   a pale tint of the hue, the name in the hue, the count on a tile. */
/* the top row is the same height closed and open, so the number and chevron stay put when a card opens */
.cnt{display:grid;grid-template-columns:1fr auto;grid-template-rows:minmax(95px,auto);min-height:96px;padding:0;background:var(--cbg);border-color:transparent;color:var(--c);cursor:pointer;transition:filter .1s}
.cnt:active{filter:brightness(.96)}
.left{padding:14px 16px 8px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.name{font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a name too long for one line: two lines at 17 px, then the ellipsis (fitNames) */
.name.two{font-size:17px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.chev{flex:none;width:44px;height:44px;margin-left:-10px;display:grid;place-items:center}
.chev svg{width:22px;height:22px;transition:transform .2s}
.open .chev svg{transform:rotate(180deg)}
.num{margin:8px;border-radius:14px;background:var(--cbox);min-width:170px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;transform-origin:right center;letter-spacing:-.02em}
.num svg{width:28px;height:28px;opacity:.9}
.bump{animation:bump .18s ease-out}
@keyframes bump{40%{transform:scale(1.1)}}
.more{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:0 8px 8px}
.more button{height:44px;padding:0 18px;border-radius:13px;font-size:17px;font-weight:650}
.move{display:flex;gap:6px;margin-left:-10px}   /* flush with the chevron, so the two arrows keep 44 px in three narrow columns */
.move button{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
.more button,.move button{background:var(--cbox);color:var(--c)}
.move button:disabled{opacity:.35}
.move svg{width:20px;height:20px}
.cnt,.sw{--cbox:var(--tile)}
/* Open (a wide screen, like the inside of iPhone Duo): the counters in two or three columns */
@media (min-width:560px){
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;align-content:start;align-items:start}
  #list .cnt{margin:0}
  #list .empty{grid-column:1/-1}
}
.c-blue{--c:var(--blue);--cbg:var(--blue-bg)}.c-red{--c:var(--red);--cbg:var(--red-bg)}.c-yellow{--c:var(--yellow);--cbg:var(--yellow-bg)}
.c-green{--c:var(--green);--cbg:var(--green-bg)}.c-purple{--c:var(--purple);--cbg:var(--purple-bg)}.c-orange{--c:var(--orange);--cbg:var(--orange-bg)}
.c-gray{--c:var(--muted);--cbg:var(--tile);--cbox:var(--chip)}
.cnt.c-gray{color:var(--text);border-color:var(--tile-line)}
.swatches{display:flex;gap:10px;margin:4px 0 18px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--tile);box-shadow:0 0 0 2px transparent}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.sheet .input{margin-bottom:14px}
.sheet .stack{margin-top:4px}
/* +, Edit and sort: a bar at the bottom, built like Converter's category bar. Hidden while the phone keyboard is up. */
main{padding-bottom:16px}
#bar{padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:.5px solid var(--line);background:var(--bg)}
#bar button{display:grid;place-items:center;min-width:44px}
#bar svg{width:22px;height:22px}
html.kb #bar{display:none}
</style>
</head>
<body>
<header>
  <h1>Counter</h1>
  <span class="sp"></span>
  <button class="round" id="setBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<main id="list" class="kb-pad"></main>

<nav class="tabs" id="bar" aria-label="Counters">
  <button id="addBtn" aria-label="Add counter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="editBtn">Edit</button>
  <button id="sortBtn" aria-label="Sort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M2.5 6.5 5 4l2.5 2.5M2.5 17.5 5 20l2.5-2.5M11 6h10M11 12h10M11 18h7"/></svg></button>
</nav>

<script src="../shared/base.js"></script>
<script>
const KEY = 'counter-v1';
// Calculator palette: blue, red, yellow first
const COLORS = ['#0A57D0','#D02A2A','#F4B400','#1F9D55','#7C3AED','#F28A00','#6E6E76'];
// old palette -> new, so existing counters pick up the new colors
const OLD_COLORS = {'#4fb89a':'#1F9D55','#4a8fd9':'#0A57D0','#e0a13a':'#F4B400','#FFD60A':'#F4B400','#e06a58':'#D02A2A','#8b6fd6':'#7C3AED','#3fa7b8':'#0A57D0','#0E8FB8':'#0A57D0','#7a8a99':'#6E6E76'};
const ICON = {
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>'
};

const { $, esc, uid, buzz, sheet, closeSheet, themeSegHTML, homeLinkHTML } = App;
// Saved colors stay as they are; each one shows as the matching TV Mount hue.
const HUE = {'#0A57D0':'blue','#D02A2A':'red','#F4B400':'yellow','#1F9D55':'green','#7C3AED':'purple','#F28A00':'orange','#6E6E76':'gray'};
const hueClass = color => HUE[color] ? ' c-' + HUE[color] : '';
const hueStyle = color => HUE[color] ? '' : ` style="--c:${esc(color)};--cbg:color-mix(in srgb,${esc(color)} 16%,var(--tile))"`;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.counters)) {
      s.counters.forEach(c => {
        if (OLD_COLORS[c.color]) c.color = OLD_COLORS[c.color];
        // An older Counter kept a time for every tap. Only the number is kept now.
        if (Array.isArray(c.events)) { c.n = c.events.length; delete c.events; }
        if (!Number.isInteger(c.n) || c.n < 0) c.n = 0;
      });
      return Object.assign({sort:'manual', theme:'auto'}, s);
    }
  } catch (e) {}
  return {counters:[], sort:'manual', theme:'auto'};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
// One theme setting is shared by every app on this site (shared/base.js). Counter also keeps
// a copy in its own data, as before; an old copy still counts when the shared setting is missing.
function loadTheme() { try { return localStorage.getItem('theme') || S.theme || 'auto'; } catch (e) { return 'auto'; } }
function syncTheme() { try { const t = localStorage.getItem('theme'); if (t && t !== S.theme) { S.theme = t; save(); } } catch (e) {} }

let S = load();
S.theme = loadTheme();
try { if (!localStorage.getItem('theme') && S.theme !== 'auto') localStorage.setItem('theme', S.theme); } catch (e) {}
let editing = false;
const expanded = new Set();

const count = c => c.n;

function sorted() {
  const a = [...S.counters];
  if (S.sort === 'name') a.sort((x, y) => x.name.localeCompare(y.name, undefined, {numeric:true}));
  if (S.sort === 'count') a.sort((x, y) => count(y) - count(x));
  return a;
}

function cardHTML(c, i, n) {
  const open = expanded.has(c.id) && !editing;
  const left = editing
    ? (S.sort === 'manual'
        ? `<div class="move"><button data-action="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ICON.up}</button><button data-action="down" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">${ICON.down}</button></div>`
        : '<div></div>')
    : `<button class="chev" data-action="toggle" aria-label="More">${ICON.chev}</button>`;
  return `<div class="card cnt${open ? ' open' : ''}${hueClass(c.color)}"${hueStyle(c.color)} data-id="${c.id}" data-action="${editing ? 'edit' : 'inc'}">
    <div class="left"><div><div class="name">${esc(c.name)}</div></div>${left}</div>
    <div class="num" id="n-${c.id}">${editing ? ICON.pen : count(c)}</div>
    ${open ? `<div class="more" data-action="none">
      <button data-action="dec">−1</button>
      <button data-action="reset">Reset</button>
    </div>` : ''}
  </div>`;
}

function render() {
  $('#editBtn').textContent = editing ? 'Done' : 'Edit';
  $('#editBtn').classList.toggle('on', editing);
  const arr = sorted();
  $('#list').innerHTML = arr.length
    ? arr.map((c, i) => cardHTML(c, i, arr.length)).join('')
    : `<div class="empty"><p>No counters yet.</p><button class="primary" data-action="add">Add a counter</button></div>`;
  fitNames();
}

// A name that does not fit on one line gets two lines at 17 px before the ellipsis.
function fitNames() {
  const names = [...document.querySelectorAll('#list .name')];
  names.forEach(n => n.classList.remove('two'));
  names.filter(n => n.scrollWidth > n.clientWidth + 1).forEach(n => n.classList.add('two'));
}

function bump(id) {
  const el = document.getElementById('n-' + id);
  if (!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/* Sheets */

function openCounterSheet(c) {
  let color = c ? c.color : COLORS[S.counters.length % COLORS.length];
  const el = sheet(`<h2>${c ? 'Edit counter' : 'New counter'}</h2>
    <input class="input" id="fLabel" name="counter_label" type="text" placeholder="What you're counting" aria-label="What you're counting" maxlength="30" autocomplete="off" enterkeyhint="done" value="${c ? esc(c.name) : ''}">
    <div class="swatches">${COLORS.map(x => `<button class="sw${x === color ? ' on' : ''} c-${HUE[x]}" data-color="${x}" aria-label="Color"></button>`).join('')}</div>
    <div class="actions">${c ? '<button class="danger" data-act="del">Delete</button>' : ''}<span class="sp"></span>
      <button class="btn" data-act="cancel">Cancel</button><button class="primary" data-act="save">${c ? 'Save' : 'Add'}</button></div>`, 'top');
  const input = el.querySelector('#fLabel');
  input.focus();

  const doSave = () => {
    const name = input.value.trim();
    if (!name) { input.placeholder = "Type what you're counting"; input.focus(); return; }
    if (c) { c.name = name; c.color = color; }
    else S.counters.push({id: uid(), name, color, n: 0});
    save(); closeSheet(); render();
  };
  input.addEventListener('keydown', e => { if (App.isEnter(e)) doSave(); });
  el.addEventListener('click', e => {
    const sw = e.target.closest('[data-color]');
    if (sw) {
      color = sw.dataset.color;
      el.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s === sw));
      return;
    }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') closeSheet();
    if (act === 'save') doSave();
    if (act === 'del') confirmSheet(`Delete ${c.name}?`, 'The counter and its count are removed.', 'Delete', () => {
      S.counters = S.counters.filter(x => x !== c);
      save(); render();
    });
  });
}

// Asks first, in a sheet like TV Mount's, instead of the browser's own dialog.
function confirmSheet(title, text, label, ok) {
  const el = sheet(`<h2>${esc(title)}</h2><p class="hint" style="font-size:16px">${esc(text)}</p>
    <div class="actions"><span class="sp"></span><button class="btn" data-act="cancel">Cancel</button><button class="danger" data-act="ok">${esc(label)}</button></div>`);
  el.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') closeSheet();
    if (act === 'ok') { closeSheet(); ok(); }
  });
}

function openSortSheet() {
  const opts = [['manual','Manual order'],['name','Name'],['count','Highest count']];
  const el = sheet(`<h2>Sort</h2>${opts.map(([k, l]) =>
    `<button class="opt" data-sort="${k}">${l}<span class="check">${S.sort === k ? '✓' : ''}</span></button>`).join('')}`);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    S.sort = b.dataset.sort; save(); closeSheet(); render();
  });
}

function openSettings() {
  const el = sheet(`<h2>Settings</h2>
    ${themeSegHTML()}
    <div class="stack">
      <button class="danger" data-act="all">Reset all counts</button>
      <button class="danger" data-act="wipe">Delete all counters</button>
    </div>${homeLinkHTML()}`);
  el.addEventListener('click', e => {
    setTimeout(syncTheme);   // the shared sheet sets the theme after this handler
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'all') confirmSheet('Reset all counts?', 'Every counter goes back to 0.', 'Reset all', () => {
      S.counters.forEach(c => c.n = 0);
      save(); render();
    });
    if (act === 'wipe' && S.counters.length) confirmSheet(`Delete all ${S.counters.length} counters?`, 'This can’t be undone.', 'Delete all', () => {
      S.counters = []; expanded.clear(); editing = false;
      save(); render();
    });
  });
}

// A tap changes one number: write it into its card. Only sorting by count can move the card, and then the list is rebuilt.
function changed(c) {
  save();
  const el = document.getElementById('n-' + c.id);
  if (S.sort === 'count' || !el) { render(); bump(c.id); return; }
  el.textContent = count(c); bump(c.id);
}

/* Events */
$('#list').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  if (a === 'add') return openCounterSheet();
  const id = e.target.closest('.card')?.dataset.id;
  const c = S.counters.find(x => x.id === id);
  if (!c) return;

  if (a === 'inc') { c.n++; changed(c); buzz(12); }
  if (a === 'dec' && count(c) > 0) { c.n--; changed(c); buzz([8, 30, 8]); }
  if (a === 'toggle') { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
  if (a === 'edit') openCounterSheet(c);
  if (a === 'reset') confirmSheet(`Reset ${c.name} to 0?`, 'The count goes back to 0.', 'Reset', () => { c.n = 0; save(); render(); });
  if (a === 'up' || a === 'down') {
    const i = S.counters.indexOf(c), j = a === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= S.counters.length) return;
    [S.counters[i], S.counters[j]] = [S.counters[j], S.counters[i]];
    save(); render();
  }
});

$('#addBtn').onclick = () => openCounterSheet();
$('#editBtn').onclick = () => { editing = !editing; render(); };
$('#sortBtn').onclick = openSortSheet;
$('#setBtn').onclick = openSettings;
let fitW = innerWidth;
window.addEventListener('resize', () => { if (innerWidth !== fitW) { fitW = innerWidth; fitNames(); } });
window.addEventListener('storage', e => { if (e.key === 'theme' && e.newValue) S.theme = e.newValue; });

App.init();
render();
</script>
</body>
</html>
